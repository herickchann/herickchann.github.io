<!DOCTYPE html>
<html>
<head>
  <!--
    Not a page: the app's front door for deep links.

    GitHub Pages is static, so `/bindr/p/{profileId}` matches no file and is
    answered with this, the custom 404. Booting Flutter here — rather than
    redirecting — keeps the requested URL intact, so the router reads the
    profile id straight off the address bar.

    Only the site root's 404.html is consulted, and herickchann.github.io
    hosts more than PokeBindr, so the app is loaded only for paths under the
    base href. Everything else gets the plain notice below.

    The href is replaced by `flutter build`'s --base-href in index.html only;
    scripts/build_web.sh substitutes it here.
  -->
  <base href="/bindr/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#15322C">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PokeBindr">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PokeBindr</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #not-found[hidden] { display: none; }
    #not-found {
      color-scheme: light dark;
      font: 16px/1.5 system-ui, sans-serif;
      margin: 4rem auto;
      max-width: 32rem;
      padding: 0 1.5rem;
    }
  </style>
</head>
<body>
  <p id="not-found" hidden>Page not found.</p>

  <script>
    (function () {
      var base = document.querySelector('base').getAttribute('href');
      if (window.location.pathname.indexOf(base) !== 0) {
        document.title = 'Page not found';
        document.getElementById('not-found').hidden = false;
        return;
      }

      // Same pair index.html loads: on-device OCR for Import → scan from
      // photo, then the Flutter loader.
      var ocr = document.createElement('script');
      ocr.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      document.head.appendChild(ocr);

      var bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
